<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>เข้าสู่ระบบ — ASTRAPHEX HUB</title>
  <meta name="description" content="เข้าสู่ระบบหรือสมัครสมาชิก ASTRAPHEX HUB">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="canonical" href="https://astraphex.panderx.xyz/front/login.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ASTRAPHEX HUB">
  <meta property="og:title" content="เข้าสู่ระบบ — ASTRAPHEX HUB">
  <meta property="og:description" content="ศูนย์รวมไอดีเกมและบริการโยนของ Arena Breakout เติมเงินง่าย ติดตามออเดอร์ได้ทุกขั้นตอน">
  <meta property="og:url" content="https://astraphex.panderx.xyz/front/login.html">
  <meta property="og:image" content="https://astraphex.panderx.xyz/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="th_TH">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://astraphex.panderx.xyz/assets/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tw.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/transition.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script>
  <script src="../js/transition.js" defer></script>
  <script type="module" src="../js/shell.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="px-4 py-10 sm:py-14">
    <div class="w-full max-w-[440px] mx-auto">
      <div class="rounded-[28px] overflow-hidden bg-black mb-6"><img src="../assets/logo-full-600.jpg" alt="ASTRAPHEX HUB" width="600" height="232" class="w-full h-auto"></div>

      <div class="apple-card p-6 sm:p-8">
        <div class="grid grid-cols-2 gap-1 bg-mist p-1 rounded-full mb-7" role="tablist">
          <button id="tab-btn-login" type="button" onclick="switchAuthMode('login')" class="py-2.5 rounded-full font-medium text-[15px]">เข้าสู่ระบบ</button>
          <button id="tab-btn-register" type="button" onclick="switchAuthMode('register')" class="py-2.5 rounded-full font-medium text-[15px]">สมัครสมาชิก</button>
        </div>

        <form id="form-login" class="space-y-4" novalidate>
          <div><h1 class="text-2xl font-heading font-semibold">เข้าสู่ระบบ</h1><p class="text-slate text-sm mt-1">ยินดีต้อนรับกลับสู่ ASTRAPHEX HUB</p></div>
          <div><label for="login-username" class="block text-sm font-medium mb-1.5">ชื่อผู้ใช้</label>
            <input id="login-username" type="text" required autocomplete="username" placeholder="ชื่อผู้ใช้ของคุณ" class="apple-input w-full px-4 py-3"></div>
          <div><label for="login-password" class="block text-sm font-medium mb-1.5">รหัสผ่าน</label>
            <div class="relative"><input id="login-password" type="password" required autocomplete="current-password" placeholder="••••••••" class="apple-input w-full px-4 py-3 pr-12">
              <button type="button" onclick="togglePasswordInput('login-password', this)" aria-label="แสดงรหัสผ่าน" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full text-steel hover:text-ink flex items-center justify-center"></button></div>
            <button type="button" onclick="forgotPassword()" class="text-sm text-appleBlue hover:underline mt-2">ลืมรหัสผ่าน?</button></div>
          <button id="btn-login-submit" type="submit" class="w-full apple-pricing-pill py-3.5 text-[16px]">เข้าสู่ระบบ</button>
        </form>

        <form id="form-register" class="space-y-4 hidden" novalidate>
          <div><h1 class="text-2xl font-heading font-semibold">สมัครสมาชิก</h1><p class="text-slate text-sm mt-1">สร้างบัญชีเพื่อเติมเงิน ซื้อไอดี และติดตามคิวงาน</p></div>
          <div><label for="register-username" class="block text-sm font-medium mb-1.5">ชื่อผู้ใช้</label>
            <input id="register-username" type="text" required maxlength="24" autocomplete="username" placeholder="3–24 ตัวอักษร ไทยหรืออังกฤษ" class="apple-input w-full px-4 py-3"></div>
          <div><label for="register-facebook" class="block text-sm font-medium mb-1.5">ชื่อหรือลิงก์ Facebook <span class="text-slate font-normal">(ไม่บังคับ)</span></label>
            <input id="register-facebook" type="text" maxlength="200" autocomplete="off" placeholder="ใช้ติดต่อเรื่องงานบริการ" class="apple-input w-full px-4 py-3"></div>
          <div><label for="register-password" class="block text-sm font-medium mb-1.5">รหัสผ่าน</label>
            <div class="relative"><input id="register-password" type="password" required minlength="6" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร" class="apple-input w-full px-4 py-3 pr-12">
              <button type="button" onclick="togglePasswordInput('register-password', this)" aria-label="แสดงรหัสผ่าน" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full text-steel hover:text-ink flex items-center justify-center"></button></div></div>
          <div><label for="register-confirm-password" class="block text-sm font-medium mb-1.5">ยืนยันรหัสผ่าน</label>
            <input id="register-confirm-password" type="password" required minlength="6" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง" class="apple-input w-full px-4 py-3"></div>
          <label class="flex items-start gap-2.5 text-sm text-slate"><input id="accept-terms" type="checkbox" class="mt-0.5 w-4 h-4">ฉันเข้าใจว่าการซื้อขายไอดีอาจขัดต่อข้อกำหนดของผู้พัฒนาเกม และยอมรับเงื่อนไขของร้าน</label>
          <button id="btn-register-submit" type="submit" class="w-full apple-pricing-pill py-3.5 text-[16px]">สร้างบัญชี</button>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
