<body>
  <header id="site-header"></header>

  <main class="max-w-[1080px] mx-auto px-4 sm:px-6 pt-6 sm:pt-10 pb-28 sm:pb-8">
    <nav class="text-sm text-slate mb-6" aria-label="breadcrumb"><a href="category.html" class="hover:text-ink">สินค้าทั้งหมด</a> › <span>กล่องสุ่ม</span></nav>
    <div id="box-head" class="mb-6">
      <h1 class="font-heading font-semibold text-3xl sm:text-4xl">กล่องสุ่ม</h1>
      <p class="text-slate mt-2">เลือกกล่องที่อยากเสี่ยง ทุกกล่องโชว์เรตดรอปจริง</p>
    </div>
    <div id="box-balance" class="bx-chip mb-4" style="display:none"></div>
    <div id="box-winners" class="bx-winners mb-6" style="display:none"></div>
    <div id="box-list"><div class="skeleton h-96 !rounded-[28px]"></div></div>
    <section class="mt-12">
      <h2 class="font-heading font-semibold text-2xl">ประวัติการเปิดของฉัน</h2>
      <div id="box-gifts" class="mt-4 space-y-2"></div>
      <div id="box-history" class="mt-4 space-y-2"><p class="text-slate text-sm">ล็อกอินเพื่อดูว่าเคยเปิดได้อะไรไปบ้าง</p></div>
    </section>
  </main>

  <div id="bx-stage" class="bx-stage" role="dialog" aria-modal="true" aria-label="เปิดกล่องสุ่ม" tabindex="-1">
    <div class="bx-top"><span class="bx-title" id="bx-stage-title"></span><div class="bx-top-btns"><button type="button" class="bx-ghost bx-icon-btn" id="bx-mute" aria-label="ปิดเสียง"></button><button type="button" class="bx-ghost" id="bx-skip" style="display:none">ข้าม</button><button type="button" class="bx-ghost" id="bx-close" style="display:none">ปิด</button></div></div>
    <div class="bx-arena"><div id="bx-arena" style="display:contents"></div><p class="bx-msg" id="bx-msg" aria-live="polite"></p></div>
    <div class="bx-reveal" id="bx-reveal"></div>
  </div>

  <div id="box-claim-modal" class="modal" role="dialog" aria-modal="true" aria-label="รับรางวัลงานบริการ">
    <div class="modal-card">
      <button type="button" id="claim-close" aria-label="ปิด" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-mist text-slate flex items-center justify-center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h3 class="text-xl font-heading font-semibold">รับรางวัลงานบริการ</h3>
      <p id="claim-info" class="text-sm text-slate mt-1"></p>
      <form id="claim-form" class="space-y-3 mt-5 text-sm">
        <input type="hidden" id="claim-open-id">
        <div><label class="block text-slate mb-1" for="claim-fb">Facebook (ชื่อหรือลิงก์)</label><input id="claim-fb" required maxlength="200" class="w-full apple-input px-3.5 py-2.5"></div>
        <div data-mode="account" class="space-y-3">
          <div><label class="block text-slate mb-1" for="claim-email">อีเมลบัญชีเกม</label><input id="claim-email" type="email" maxlength="200" class="w-full apple-input px-3.5 py-2.5"></div>
          <div><label class="block text-slate mb-1" for="claim-pass">รหัสผ่านบัญชีเกม</label><input id="claim-pass" maxlength="200" autocomplete="off" class="w-full apple-input px-3.5 py-2.5"></div>
        </div>
        <div data-mode="self" class="space-y-3">
          <div><label class="block text-slate mb-1" for="claim-name">ชื่อในเกม</label><input id="claim-name" maxlength="200" class="w-full apple-input px-3.5 py-2.5"></div>
          <div><label class="block text-slate mb-1" for="claim-time">เวลาที่พร้อมเล่น</label><input id="claim-time" maxlength="200" placeholder="เช่น ทุกวัน 20:00-23:00" class="w-full apple-input px-3.5 py-2.5"></div>
        </div>
        <button type="submit" id="claim-submit" class="apple-pricing-pill w-full py-3 text-base">ยืนยันรับรางวัล</button>
      </form>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script type="module" src="../js/box.js"></script>
