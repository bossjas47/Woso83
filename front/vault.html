<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>โปรแกรมจัดการไอดีไก่ — ASTRAPHEX HUB</title>
  <meta name="description" content="จัดการไอดี แจกงานทีม ตรวจประวัติย้อนหลัง">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="canonical" href="https://astraphex.panderx.xyz/front/vault.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ASTRAPHEX HUB">
  <meta property="og:title" content="คลังไอดี — ASTRAPHEX HUB">
  <meta property="og:description" content="ศูนย์รวมไอดีเกมและบริการโยนของ Arena Breakout เติมเงินง่าย ติดตามออเดอร์ได้ทุกขั้นตอน">
  <meta property="og:url" content="https://astraphex.panderx.xyz/front/vault.html">
  <meta property="og:image" content="https://astraphex.panderx.xyz/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="th_TH">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://astraphex.panderx.xyz/assets/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tw.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/transition.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script>
  <script src="../js/transition.js" defer></script>
  <script type="module" src="../js/shell.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="max-w-[960px] mx-auto px-4 sm:px-6 pt-8 sm:pt-12 pb-16">
    <div class="flex items-end justify-between gap-3 flex-wrap">
      <h1 class="font-heading font-semibold text-3xl sm:text-4xl">โปรแกรมจัดการไอดีไก่</h1>
      <p id="v-until" class="text-sm text-slate"></p>
    </div>
    <div id="v-warn" class="hidden mt-4 rounded-[20px] bg-mist px-4 py-3 text-sm"></div>
    <div id="v-gate" class="soft-card py-12 px-6 text-center mt-6"><div class="skeleton h-10 !rounded-[20px]"></div></div>

    <div id="v-app" class="hidden mt-6">
      <div class="flex items-center gap-2 overflow-x-auto pb-1" id="v-tabs"></div>

      <section class="soft-card p-4 sm:p-5 mt-4">
        <div class="flex flex-wrap items-center gap-2" id="v-bar">
          <button type="button" onclick="vAdd()" class="apple-pricing-pill px-4 py-2 text-[13px]">+ เพิ่มไอดี</button>
          <button type="button" onclick="vPull()" class="rounded-full border border-steel px-4 py-2 text-[13px]">ดึงตามจำนวน</button>
          <button type="button" onclick="vExport()" class="rounded-full border border-steel px-4 py-2 text-[13px]">ส่งออก</button>
          <button type="button" onclick="vTrash()" class="rounded-full border border-steel px-4 py-2 text-[13px]">ถังขยะ <span id="v-trash-n" class="text-slate"></span></button>
          <button type="button" onclick="vGuide()" class="text-appleBlue text-[13px] px-2">วิธีใช้</button>
        </div>
        <div class="flex flex-wrap items-center gap-2 mt-3">
          <input id="v-q" type="search" placeholder="ค้นหาไอดี" oninput="vFilter()" class="flex-1 min-w-[140px] apple-input px-3.5 py-2 text-[14px]">
          <select id="v-flt" onchange="vFilter()" class="apple-input px-3 py-2 text-[14px]"><option value="">ทั้งหมด</option><option value="free">ยังไม่มอบหมาย</option><option value="assigned">มอบหมายแล้ว</option><option value="done">เสร็จแล้ว</option><option value="issue">มีปัญหา</option><option value="sold">ขายแล้ว</option><option value="hold">พักไว้</option></select>
          <label class="text-[13px] text-slate flex items-center gap-2"><input type="checkbox" id="v-all" onchange="vSelAll(this.checked)"> เลือกทั้งหมด</label>
        </div>
        <div id="v-sel" class="hidden flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-hairline">
          <span id="v-sel-n" class="text-[13px] font-medium"></span><span class="flex-1"></span>
          <button type="button" onclick="vMove()" class="rounded-full border border-steel px-3.5 py-1.5 text-[13px]">ย้ายแท็บ</button>
          <button type="button" onclick="vAssign()" class="rounded-full border border-steel px-3.5 py-1.5 text-[13px]">มอบหมายทีม</button>
          <button type="button" onclick="vStatus()" class="rounded-full border border-steel px-3.5 py-1.5 text-[13px]">ตั้งสถานะ</button>
          <button type="button" onclick="vClearIssue()" class="rounded-full border border-steel px-3.5 py-1.5 text-[13px]">ล้างปัญหา</button>
          <button type="button" onclick="vDelete()" class="rounded-full border border-launchOrange text-launchOrange px-3.5 py-1.5 text-[13px]">ลบ</button>
        </div>
        <div id="v-list" class="mt-3 divide-y divide-hairline"></div>
      </section>

      <section class="mt-10">
        <div class="flex items-center justify-between"><h2 class="font-heading font-semibold text-2xl">ทีมงาน</h2><button type="button" onclick="vNewMember()" class="text-appleBlue text-[15px]">+ เพิ่มคน</button></div>
        <p class="text-sm text-slate mt-1">มอบหมายไอดีให้ใคร แล้วส่งลิงก์ให้คนนั้น เขาเปิดเห็นเฉพาะไอดีของตัวเอง ไม่ต้องสมัครสมาชิก</p>
        <div id="v-team" class="mt-3 space-y-2"></div>
      </section>

      <section class="mt-10">
        <h2 class="font-heading font-semibold text-2xl">ประวัติย้อนหลัง</h2>
        <div id="v-logs" class="mt-3 soft-card divide-y divide-hairline"></div>
      </section>
    </div>
  </main>

  <div id="v-modal" class="modal" role="dialog" aria-modal="true" aria-label="คลังไอดี">
    <div class="modal-card !max-w-md">
      <button type="button" onclick="closeModal('v-modal')" aria-label="ปิด" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-mist text-slate">✕</button>
      <h3 id="vm-title" class="text-xl font-heading font-semibold mb-3"></h3>
      <p id="vm-hint" class="text-sm text-slate mb-3"></p>
      <div id="vm-body"></div>
      <div class="flex justify-end gap-2 mt-4"><button type="button" id="vm-alt" class="hidden rounded-full border border-steel px-4 py-2 text-[14px]"></button><button type="button" id="vm-ok" class="apple-pricing-pill px-6 py-2.5 text-[15px]">ตกลง</button></div>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script type="module" src="../js/vault.js"></script>
</body>
</html>
