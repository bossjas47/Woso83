  <meta property="og:url" content="https://astraphex.panderx.xyz/front/vault.html">
  <meta property="og:image" content="https://astraphex.panderx.xyz/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:image" content="https://astraphex.panderx.xyz/assets/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js" crossorigin>
  <link rel="stylesheet" href="../css/tw.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/transition.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/vault.css">
  <script src="../js/theme.js"></script>
  <script src="../js/transition.js" defer></script>
  <script type="module" src="../js/shell.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="max-w-[1180px] mx-auto px-4 sm:px-6 pt-6 sm:pt-10 pb-40">
    <div id="v-warn" class="hidden mb-4 rounded-[20px] bg-mist px-4 py-3 text-sm"></div>
    <div id="v-gate" class="vx-empty mt-6"><div class="skeleton h-10 !rounded-[20px]"></div></div>

    <p class="text-[13px] text-slate mb-4 flex flex-wrap gap-2 justify-end"><span id="v-until"></span><a href="team.html" class="text-appleBlue">ทีมของฉัน (ลูกทีม) ›</a></p>
    <div id="v-app" class="hidden vx">
      <aside class="vx-side" id="v-side" aria-label="แท็บ"></aside>
      <section class="min-w-0">
        <div id="v-head"></div>
        <div class="vx-tools">
          <input id="v-q" type="search" placeholder="ค้นหา" oninput="vFilter()" class="vx-search" aria-label="ค้นหา">
          <span class="vx-quick" title="ติ๊กอัตโนมัติ">ติ๊ก <input id="v-n" type="number" min="1" inputmode="numeric" value="10" aria-label="จำนวนที่จะติ๊ก"><button type="button" onclick="vQuick('first')">แรก</button><button type="button" onclick="vQuick('rand')">สุ่ม</button></span>
          <button type="button" id="v-add" onclick="vAdd()" class="vx-btn pri">+ สต๊อก</button>
          <details class="vx-menu"><summary class="vx-btn" aria-label="เมนูเพิ่มเติม">⋯</summary><div class="vx-pop" onclick="this.closest('details').open=false">
            <button type="button" onclick="vCopyAll()">คัดลอกทั้งแท็บ</button>
            <button type="button" onclick="vSortAmmo()">เรียงตามกระสุน (มาก→น้อย)</button>
            <button type="button" onclick="vNotify()">แจ้งเตือนเข้ามือถือ</button>
            <button type="button" onclick="vLabels()">ตั้งชื่อสถานะ</button>
            <button type="button" onclick="vRename()">เปลี่ยนชื่อแท็บ</button>
            <button type="button" onclick="vTrash()">ถังขยะ <span id="v-trash-n"></span></button>
            <button type="button" onclick="vGuide()">วิธีใช้</button>
            <button type="button" onclick="vDelTab()" class="warn">ลบแท็บนี้</button>
          </div></details>
        </div>
        <div id="v-team"></div>
        <div id="v-list" class="mt-4"></div>
        <details class="vx-more"><summary>ประวัติการขาย <span id="v-sales-n" class="text-slate font-normal"></span></summary><div id="v-sales"></div></details>
        <details class="vx-more" style="margin-top:12px"><summary>ประวัติการทำรายการ</summary><div id="v-logs"></div></details>
      </section>
    </div>
  </main>

  <div id="v-bar" class="vx-bar" role="region" aria-label="รายการที่เลือก">
    <div class="vx-bar-top"><b id="v-bar-n"></b><span id="v-bar-sum"></span><span class="sp"></span><button type="button" onclick="vClear()" class="x" aria-label="ยกเลิกการเลือก">✕</button></div>
    <div class="vx-dest"><button type="button" onclick="vSell()" class="pri">ขาย</button><button type="button" onclick="vEdit()">แก้ไข</button><button type="button" onclick="vCopySel()">คัดลอก</button><button type="button" onclick="vDelete()">ลบ</button></div>
    <div class="vx-dest" id="v-dest"></div>
  </div>

  <div id="v-modal" class="modal" role="dialog" aria-modal="true" aria-label="คลังไอดี">
    <div class="modal-card !max-w-md">
      <button type="button" onclick="closeModal('v-modal')" aria-label="ปิด" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-mist text-slate">✕</button>
      <h3 id="vm-title" class="text-xl font-heading font-semibold mb-3"></h3>
      <p id="vm-hint" class="text-sm text-slate mb-3"></p>
      <div id="vm-body"></div>
      <div class="flex justify-end gap-2 mt-4"><button type="button" id="vm-alt" class="hidden rounded-full border border-steel px-4 py-2 text-[14px]"></button><button type="button" id="vm-ok" class="apple-pricing-pill px-6 py-2.5 text-[15px]">ตกลง</button></div>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script type="module" src="../js/vault.js"></script>
</body>
</html>
